version: '3.8'

services:
  navix-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://navix_user:navix_pass@postgres:5432/navix
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=navix_local_dev_secret_key
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=navix_user
      - POSTGRES_PASSWORD=navix_pass
      - POSTGRES_DB=navix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
